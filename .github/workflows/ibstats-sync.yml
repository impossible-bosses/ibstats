name: IBStat replay synchronization
on:
  pull_request:
    paths:
      - '.github/workflows/ibstats-sync.yml'
      - 'refresh.js'
      - 'scripts/**'
      - 'player/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified replay data and request a Pages build'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: ibstats-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  preview:
    name: Preview and verify (read-only)
    if: github.event_name != 'schedule' || vars.IBSTATS_AUTO_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: |
          node tests/registration.test.js
          node tests/staged-data.test.js
          node tests/unconfirmed.test.js
          node tests/staged-files.test.js
      - name: Collect into staging
        run: node refresh.js --input data/replays.json --output staging/replays.json
      - name: Verify without changing repository files
        run: node scripts/apply-staged-replays.js data/replays.json staging/replays.json staging/refresh-status.json --check
      - name: Save review artifacts even on collection failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibstats-sync-review
          path: staging/
          if-no-files-found: warn
          retention-days: 7
  publish:
    name: Publish verified data
    needs: preview
    if: needs.preview.result == 'success' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.IBSTATS_AUTO_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ibstats-sync-review
          path: staging/
      - name: Validate Pages access before committing data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source.branch' | grep -Fx main
      - name: Apply verified data
        run: node scripts/apply-staged-replays.js data/replays.json staging/replays.json staging/refresh-status.json
      - name: Commit only generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/replays.json data/refresh-status.json
          if ! git diff --cached --quiet -- data/replays.json data/refresh-status.json; then
            git commit -m 'auto-refresh replay data' -- data/replays.json data/refresh-status.json
            git push origin HEAD:main
          fi
      - name: Request and verify Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          for attempt in $(seq 1 18); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > /tmp/ibstats-pages-build.json
            if REVISION="$revision" node -e 'const b=require("/tmp/ibstats-pages-build.json"); if(b.status==="errored") process.exit(2); process.exit(b.status==="built" && b.commit===process.env.REVISION ? 0:1)'; then
              echo 'Requested revision has a successful Pages build.'
              exit 0
            else
              result=$?
              test "$result" -ne 2 || exit 1
            fi
            sleep 10
          done
          echo 'Data was committed, but Pages completion was not confirmed.' >&2
          exit 1
